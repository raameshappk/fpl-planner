name: Weekly backtest

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays at 05:00 UTC, before the daily refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backtest.py
      - name: Commit if changed
        run: |
          git config user.name "projections-bot"
          git config user.email "actions@users.noreply.github.com"
          git add calibration.json accuracy.json
          git diff --cached --quiet || git commit -m "Update backtest"
          git push
